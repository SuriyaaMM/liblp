[project]
name = "liblp"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "ml-dtypes>=0.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "ruff>=0.16.8",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch>=2.14.0",
    "torchvision>=0.29.1",
    "transformers>=5.23.0",
    "triton>=3.8.0; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
include = ["liblp*"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
]
triton = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }
]
